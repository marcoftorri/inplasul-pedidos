<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos Inplasul</title>
<meta name="theme-color" content="#0b4f8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pedidos Inplasul">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --azul:#0b4f8a; --azul2:#0e64ad; --azul-claro:#e6eef7;
  --fundo:#f3f5f8; --card:#fff; --texto:#1b2430; --sub:#5f6b7a; --linha:#e1e6ec;
  --verde:#1d8a4e; --amarelo:#b7791f; --vermelho:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--azul);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
#sync{font-size:12px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;white-space:nowrap;border:0;color:#fff}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--azul);font-weight:700}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 8px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--linha);border-radius:10px;background:#fff;color:var(--texto);font-family:inherit}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--azul2);border-color:transparent}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--azul);color:#fff;margin-top:10px;font-family:inherit}
.btn.sec{background:var(--azul-claro);color:var(--azul)}
.btn.perigo{background:#fbeaea;color:var(--vermelho)}
.btn.min{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0}
.mat{border-top:1px solid var(--linha);padding:10px 0}
.mat:first-child{border-top:0}
.mat .nome{font-weight:600;font-size:14px}
.mat .campos{display:flex;gap:8px;margin-top:6px;align-items:flex-end}
.mat .campos>div{flex:1}
.mat .campos label{margin:0 0 3px;font-size:11px}
.mat .sub{font-size:13px;color:var(--sub);text-align:right;min-width:92px;padding-bottom:12px}
.mat.ativo .nome{color:var(--azul)}
.mat.ativo .sub{color:var(--texto);font-weight:700}
.totais{display:flex;justify-content:space-between;align-items:center;background:var(--azul);color:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.totais b{font-size:22px}
.lista .item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--linha);cursor:pointer}
.lista .item:first-child{border-top:0}
.lista .t{font-weight:600}
.lista .s{font-size:13px;color:var(--sub)}
.lista .d{text-align:right;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.b-Enviado{background:#fff4e0;color:var(--amarelo)}
.b-Faturado{background:#e3f4ea;color:var(--verde)}
.b-Cancelado{background:#fbeaea;color:var(--vermelho)}
.res{border:1px solid var(--linha);border-radius:10px;margin-top:4px;max-height:260px;overflow:auto;background:#fff}
.res div{padding:10px 12px;border-top:1px solid var(--linha);cursor:pointer}
.res div:first-child{border-top:0}
.cli-sel{background:var(--azul-claro);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cli-sel .s{font-size:13px;color:var(--sub)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:14px;padding:12px}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-size:19px;font-weight:700;margin-top:2px}
.kpi.dest{background:var(--azul);color:#fff}.kpi.dest .l{color:#cfe0f2}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;border-top:1px solid var(--linha);text-align:left}
th{font-size:12px;color:var(--sub);border-top:0}
td.n,th.n{text-align:right;white-space:nowrap}
.vazio{color:var(--sub);text-align:center;padding:24px 8px}
.dica{font-size:13px;color:var(--sub)}
#modal{position:fixed;inset:0;background:rgba(10,20,35,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:var(--fundo);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
#modal .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#modal .fechar{border:0;background:#dde3ea;border-radius:20px;width:32px;height:32px;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--linha);background:#fff;border-radius:20px;padding:7px 12px;font-size:14px}
.chips button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
</style>
</head>
<body>
<header>
  <h1>Pedidos Inplasul</h1>
  <button id="sync" onclick="App.sincronizar(true)">…</button>
</header>
<main id="main"></main>
<nav>
  <button data-v="novo"><span class="i">＋</span>Pedido</button>
  <button data-v="historico"><span class="i">☰</span>Histórico</button>
  <button data-v="relatorio"><span class="i">▤</span>Relatório</button>
  <button data-v="clientes"><span class="i">☺</span>Clientes</button>
  <button data-v="ajustes"><span class="i">⚙</span>Ajustes</button>
</nav>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<input type="file" id="arquivoClientes" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="arquivoBackup" accept=".json" hidden>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
